<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memori Pulih: game edukasi rehabilitasi dan IBM</title>
<style>
:root{--card:#f7f9ff;--ink:#14173f;--mut:#5a5f8a;--good:#22d39a;--bad:#ff5d73;--gold:#ffc247;--panel:rgba(12,14,46,.62);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#20244f;--ink:#eef0ff;--mut:#a6abd8;color-scheme:dark}}
:root[data-theme="dark"]{--card:#20244f;--ink:#eef0ff;--mut:#a6abd8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:17px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;background:linear-gradient(#171a45,#3a3590) fixed;overflow-x:hidden}
main{max-width:640px;margin:0 auto;padding:14px 14px 110px}
#snd{position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:5;width:44px;height:44px;padding:0;font-size:20px;border-radius:50%}
.btn{font:inherit;font-weight:800;color:var(--ink);background:var(--card);border:0;border-radius:16px;padding:13px 14px;box-shadow:0 5px 0 rgba(0,0,0,.3);cursor:pointer;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.go{background:var(--gold);color:#2a1d00}
.card{background:var(--card);color:var(--ink);border-radius:26px;padding:22px 20px;box-shadow:0 8px 0 rgba(0,0,0,.28);margin:16px 0}
h1{font-size:clamp(46px,14vw,76px);line-height:.95;margin:.1em 0;letter-spacing:-.04em}
h2{margin:.2em 0 .4em;font-size:26px;line-height:1.2}
h3{margin:1em 0 .3em;font-size:17px}
.lv{display:grid;gap:10px;margin:14px 0}
.lv .btn{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:10px}
.lv small{color:var(--mut);font-weight:400}
.lv svg{flex:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.help{border-top:2px solid rgba(127,127,170,.3);margin-top:14px;padding-top:10px;font-size:14px;color:var(--mut)}
.hud{display:flex;gap:8px;margin-top:44px}
.hud div{flex:1;background:var(--panel);border-radius:14px;padding:6px 8px;text-align:center}
.hud b{display:block;font-size:20px;line-height:1.2}.hud small{font-size:11px}
.board{display:grid;gap:10px;grid-template-columns:repeat(var(--cm),1fr);margin:16px 0}
@media (min-width:560px){.board{grid-template-columns:repeat(var(--cd),1fr)}}
.cd{display:block;border:0;padding:0;background:none;perspective:700px;min-height:116px;height:100%;cursor:pointer;font:inherit}
.in{position:relative;display:block;width:100%;height:100%;min-height:116px;transform-style:preserve-3d;transition:transform .45s}
.cd.on .in,.cd.peek .in{transform:rotateY(180deg)}
.f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.bk{background:repeating-linear-gradient(45deg,#3a3590 0 10px,#4a45a8 10px 20px);font-size:34px}
.fr{transform:rotateY(180deg);background:var(--card);color:var(--ink)}
.tm{border-top:6px solid var(--gold)}.tm b{font-size:17px;line-height:1.15;margin-top:3px}.tm small{font-size:11px;color:var(--mut);line-height:1.2;margin-top:2px}
.df{border-top:6px solid #7aa7ff;font-size:13.5px;line-height:1.3}
.nm{font-size:20px;line-height:1.15}
.cd.ok .fr{background:var(--good);color:#04281c}.cd.ok .fr small{color:#04281c}
.cd.ok{cursor:default}
.cd:focus-visible .in{outline:3px solid var(--gold);outline-offset:3px;border-radius:16px}
svg{display:block;max-width:100%;border-radius:16px}
.big{display:flex;justify-content:center;margin:6px 0 10px}
.qd{font-size:19px;font-weight:700;margin:.3em 0 .8em;line-height:1.35}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:10px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:64px;font-size:18px}
.opt.yes{background:var(--good);color:#04281c}.opt.no{background:var(--bad);color:#fff}
.bar{height:10px;border-radius:9px;background:var(--panel);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--gold);transition:width .1s linear}
#ft{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:var(--gold);color:#2a1d00;border-radius:16px;padding:10px 14px;font-weight:700;font-size:15px;box-shadow:0 5px 0 rgba(0,0,0,.3);transform:translateY(160%);transition:transform .3s;z-index:6}
#ft.show{transform:none}
.stars{font-size:44px;letter-spacing:4px}
dl{margin:0;font-size:14px}dt{font-weight:800;margin-top:9px;display:flex;align-items:center;gap:8px}dd{margin:0 0 0 0;color:var(--mut)}
.cf{position:fixed;left:50%;top:40%;width:9px;height:14px;z-index:9;pointer-events:none;animation:cf 1.3s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.in,#ft,.bar i{transition:none}.cf{display:none}}
</style>
</head>
<body>
<button class="btn" id="snd" aria-label="Suara">🔊</button>
<main><div id="app"></div></main>
<div id="ft" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
/* ilustrasi: [warna latar, bentuk] */
const W='<g fill="#fff">',E='</g>';
const A=[
["#ff7043",W+'<circle cx="18" cy="30" r="6"/><circle cx="32" cy="27" r="7"/><circle cx="46" cy="30" r="6"/><rect x="10" y="38" width="16" height="16" rx="8"/><rect x="24" y="36" width="16" height="18" rx="8"/><rect x="38" y="38" width="16" height="16" rx="8"/>'+E+'<path d="M32 8c-2-4-8-1-5 3l5 4 5-4c3-4-3-7-5-3z" fill="#e8173f"/>'],
["#1e88e5",'<rect x="16" y="10" width="32" height="44" rx="5" fill="#fff"/><rect x="25" y="6" width="14" height="8" rx="3" fill="#0d47a1"/><path d="M22 28l5 5 9-10" stroke="#22d39a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 42h20M22 48h14" stroke="#90a4ae" stroke-width="3" stroke-linecap="round"/>'],
["#5c6bc0",'<path d="M32 8l20 7v15c0 14-9 22-20 26C21 52 12 44 12 30V15z" fill="#fff"/><path d="M22 31l7 7 13-14" stroke="#5c6bc0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'],
["#00897b",'<path d="M26 8h12v14l12 24c2 5-1 10-6 10H20c-5 0-8-5-6-10l12-24z" fill="#fff"/><path d="M19 42h26l4 6c1 3 0 6-4 6H20c-4 0-5-3-4-6z" fill="#1de9b6"/><circle cx="30" cy="47" r="2.5" fill="#fff"/><circle cx="38" cy="50" r="2" fill="#fff"/>'],
["#ab47bc",'<rect x="12" y="10" width="30" height="40" rx="4" fill="#fff"/><path d="M18 20h18M18 28h18M18 36h10" stroke="#ce93d8" stroke-width="3" stroke-linecap="round"/><circle cx="44" cy="40" r="9" fill="#e1bee7" stroke="#4a148c" stroke-width="4"/><path d="M50 47l8 8" stroke="#4a148c" stroke-width="5" stroke-linecap="round"/>'],
["#fb8c00",'<path d="M8 10h30a4 4 0 014 4v14a4 4 0 01-4 4H22l-8 7v-7H8a4 4 0 01-4-4V14a4 4 0 014-4z" fill="#fff"/><path d="M26 30h26a4 4 0 014 4v12a4 4 0 01-4 4h-4v7l-8-7H26a4 4 0 01-4-4V34a4 4 0 014-4z" fill="#ffe0b2"/><g fill="#fb8c00"><circle cx="14" cy="21" r="2.2"/><circle cx="22" cy="21" r="2.2"/><circle cx="30" cy="21" r="2.2"/></g>'],
["#43a047",'<path d="M32 54V32" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M32 38C20 38 14 30 14 20c12 0 18 7 18 18z" fill="#c8e6c9"/><path d="M32 32c0-10 6-16 18-16 0 10-6 16-18 16z" fill="#fff"/><path d="M14 54h36" stroke="#795548" stroke-width="5" stroke-linecap="round"/>'],
["#607d8b",'<path d="M48 22A18 18 0 1 0 50 38" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M53 8v19H34z" fill="#fff"/>'],
["#e53935",W+'<circle cx="32" cy="22" r="9"/><rect x="16" y="34" width="32" height="22" rx="11"/>'+E+'<circle cx="32" cy="32" r="24" fill="none" stroke="#7f0000" stroke-width="6"/><path d="M15 49L49 15" stroke="#7f0000" stroke-width="6"/>'],
["#039be5",'<g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M4 22q7-9 14 0t14 0t14 0t14 0"/><path d="M4 34q7-7 14 0t14 0t14 0t14 0" opacity=".7"/><path d="M4 46q7-4 14 0t14 0t14 0t14 0" opacity=".45"/></g>'],
["#fdd835",'<circle cx="32" cy="18" r="9" fill="#ffe0b2"/><path d="M23 16a9 9 0 0118 0z" fill="#fff"/><path d="M14 56c0-14 7-24 18-24s18 10 18 24z" fill="#ff7043"/><path d="M26 34l6 10 6-10" stroke="#fff176" stroke-width="3" fill="none"/><path d="M32 48c-2-3-6-1-4 2l4 3 4-3c2-3-2-5-4-2z" fill="#fff"/>'],
["#00acc1",'<rect x="10" y="22" width="30" height="32" rx="3" fill="#fff"/><path d="M25 28v14M18 35h14" stroke="#e53935" stroke-width="5" stroke-linecap="round"/><path d="M45 38h11M51 32l6 6-6 6" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'],
["#8d6e63",'<path d="M8 32L32 10l24 22v22H8z" fill="#fff"/><path d="M32 24v16M24 32h16" stroke="#e53935" stroke-width="5" stroke-linecap="round"/><rect x="26" y="44" width="12" height="10" fill="#bcaaa4"/>'],
["#ec407a",'<circle cx="32" cy="32" r="18" fill="none" stroke="#f8bbd0" stroke-width="3"/>'+W+'<circle cx="32" cy="14" r="6"/><circle cx="48" cy="23" r="6"/><circle cx="48" cy="41" r="6"/><circle cx="32" cy="50" r="6"/><circle cx="16" cy="41" r="6"/><circle cx="16" cy="23" r="6"/>'+E+'<path d="M32 38c-2-4-8-1-5 3l5 4 5-4c3-4-3-7-5-3z" fill="#fff"/>'],
["#c0ca33",'<path d="M44 8a12 12 0 00-10 17L10 49a5 5 0 007 7l24-24a12 12 0 0017-10l-8 6-7-2-2-7z" fill="#fff"/>'],
["#3949ab",'<path d="M16 14c-4 0-6 3-5 8 3 17 15 29 31 31 5 1 8-2 8-6v-6l-10-4-5 5c-7-3-12-8-15-15l5-5-4-10z" fill="#fff"/><text x="44" y="26" font-size="16" font-weight="800" fill="#fff" text-anchor="middle" font-family="sans-serif">184</text>']];
const svg=(i,s=64)=>`<svg viewBox="0 0 64 64" width="${s}" height="${s}" aria-hidden="true"><rect width="64" height="64" fill="${A[i][0]}"/>${A[i][1]}</svg>`;
/* [istilah, arti, kepanjangan] */
const P=[["IBM","Warga ikut menjangkau dan merujuk ke layanan","Intervensi Berbasis Masyarakat"],
["IPWL","Tempat melapor sukarela untuk rehabilitasi","Institusi Penerima Wajib Lapor"],
["P4GN","Kebijakan nasional cegah dan berantas narkoba",""],
["Detoksifikasi","Membersihkan tubuh dari zat, diawasi tenaga medis",""],
["Asesmen","Penilaian awal untuk menentukan layanan",""],
["Konseling","Bicara dengan pendamping untuk kenali pemicu",""],
["Pascarehab","Pendampingan lanjutan agar tetap pulih",""],
["Lapse","Tergelincir kembali, bukan akhir pemulihan",""],
["Stigma","Cap negatif yang menghalangi orang minta bantuan",""],
["Craving","Dorongan kuat yang naik lalu mereda",""],
["Relawan","Warga terlatih yang membantu penjangkauan",""],
["Rawat jalan","Layanan rehabilitasi tanpa menginap",""],
["Rawat inap","Layanan rehabilitasi dengan tinggal di lembaga",""],
["Kelompok dukungan","Sesama penyintas saling menguatkan",""],
["Vokasi","Pelatihan keterampilan kerja bagi klien",""],
["184","Layanan informasi BNN",""]];
P.forEach((p,i)=>p[3]=i);
const nm=p=>p[0]+(p[2]?" ("+p[2]+")":"");
const M=[["gambar","🖼️","Memori Gambar","Cocokkan gambar dengan istilahnya","m"],
["makna","🧠","Memori Makna","Cocokkan istilah dengan artinya","m"],
["kilat","⚡","Tebak Kilat","Lihat gambar, pilih istilah. Lawan waktu!","q"],
["pilih","🎯","Pilih Gambar","Baca arti, pilih gambar yang tepat","q"],
["bs","✅","Benar atau Salah","Apakah arti itu cocok dengan istilahnya?","q"]];
const N=[4,6,8],SKY=["linear-gradient(#171a45,#3a3590)","linear-gradient(#3a3590,#d6648a)","linear-gradient(#d6648a,#ffb86b)"];
let G={},ST={},mute=false,ac,ftT;
try{ST=JSON.parse(localStorage.getItem("memoriPulih2"))||{}}catch(e){}
const save=()=>{try{localStorage.setItem("memoriPulih2",JSON.stringify(ST))}catch(e){}};
const best=m=>Math.max(0,...Object.keys(ST).filter(k=>k==m||k.startsWith(m+"_")).map(k=>ST[k]));
const starTxt=n=>"⭐".repeat(n)||"<small>belum dimainkan</small>";
/* efek suara */
function snd(f,d=.14,t="triangle",v=.22,at=0,f2){if(mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state!="running")ac.resume();const T=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g);g.connect(ac.destination);o.start(T);o.stop(T+d+.02)}catch(e){}}
const unlock=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state!="running")ac.resume()}catch(e){}};
["pointerdown","touchend","keydown","click"].forEach(e=>addEventListener(e,unlock,true));
const S={
click:()=>snd(500,.05,"square",.06),
flip:()=>snd(300,.09,"square",.08,0,520),
good:c=>{const k=1+Math.min(c,6)*.1;snd(523*k,.12);snd(784*k,.2,"triangle",.22,.09)},
bad:()=>{snd(220,.35,"sawtooth",.12,0,110)},
tick:()=>snd(900,.04,"square",.07),
peek:()=>snd(660,.15,"sine",.2,0,990),
start:()=>[392,523,659].forEach((f,i)=>snd(f,.12,"triangle",.18,i*.08)),
fan:()=>[523,659,784,1046,1318].forEach((f,i)=>snd(f,.22,"triangle",.22,i*.11)),
over:()=>[392,330,262].forEach((f,i)=>snd(f,.22,"triangle",.2,i*.14))};
addEventListener("pointerdown",e=>{if(e.target.closest(".btn"))S.click()},true);
$("#snd").onclick=()=>{mute=!mute;$("#snd").textContent=mute?"🔇":"🔊"};
function boom(){const c=["#ffc247","#22d39a","#ff5d73","#7aa7ff","#fff"];for(let i=0;i<44;i++){const s=document.createElement("span");s.className="cf";s.style.background=c[i%5];s.style.setProperty("--x",(Math.random()*340-170)+"px");s.style.setProperty("--y",(Math.random()*-260+120)+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}
function fact(t){const f=$("#ft");f.textContent=t;f.classList.add("show");clearTimeout(ftT);ftT=setTimeout(()=>f.classList.remove("show"),3600)}
function reset(){clearInterval(G.iv);G={};$("#ft").classList.remove("show");document.body.style.background="";window.scrollTo(0,0)}
/* menu */
function menu(){
reset();
$("#app").innerHTML=`<div class="card" style="margin-top:40px"><h1>Memori Pulih</h1>
<p>Lima cara bermain untuk mengenal istilah rehabilitasi, anti narkoba, dan <b>IBM (Intervensi Berbasis Masyarakat)</b>. Tiap jawaban benar membuka satu pengetahuan baru.</p>
<div class="lv">${M.map((m,i)=>`<button class="btn" data-m="${i}"><span>${m[1]} ${m[2]}<br><small>${m[3]}</small></span><span>${starTxt(best(m[0]))}</span></button>`).join("")}</div>
<p class="help">Butuh bantuan di dunia nyata? Lapor sukarela ke Institusi Penerima Wajib Lapor (IPWL) terdekat atau hubungi layanan informasi BNN di 184. Permainan ini bersifat edukasi.</p></div>`;
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const m=M[+b.dataset.m];m[4]=="m"?levels(m):quiz(m[0])})}
function levels(m){
reset();
$("#app").innerHTML=`<div class="card" style="margin-top:40px"><h2>${m[1]} ${m[2]}</h2><p>${m[3]}. Bintang dihitung dari jumlah langkah. Kombo beruntun melipatgandakan skor, dan ada dua kali intip tiap level.</p>
<div class="lv">${N.map((n,i)=>`<button class="btn" data-l="${i}"><span>Level ${i+1}<br><small>${n} pasang kartu</small></span><span>${starTxt(ST[m[0]+"_"+i]||0)}</span></button>`).join("")}</div>
<button class="btn" id="bk">Kembali</button></div>`;
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>play(m[0],+b.dataset.l));$("#bk").onclick=menu}
/* memori kartu */
function face(mode,p,t){
if(mode=="gambar")return t?`<b class="nm">${p[0]}</b>${p[2]?`<small>${p[2]}</small>`:""}`:svg(p[3],84);
return t?p[1]:`${svg(p[3],48)}<b>${p[0]}</b>${p[2]?`<small>${p[2]}</small>`:""}`}
function hud(){$("#hud").innerHTML=`<div><b>${G.moves}</b><small>langkah</small></div><div><b>${fmt(G.sec)}</b><small>waktu</small></div><div><b>${G.score}</b><small>skor</small></div><div><b>${G.combo>1?"x"+G.combo:"-"}</b><small>kombo</small></div>`;$("#hn").textContent=`💡 Intip (${G.hint})`}
function play(mode,L){
reset();const n=N[L],ch=[P[0],...shuf(P.slice(1)).slice(0,n-1)],cards=shuf(ch.flatMap((p,i)=>[[i,0],[i,1]]));
G={mode,L,n,ch,cards,open:[],lock:false,found:0,moves:0,score:0,combo:0,hint:2,sec:0};
document.body.style.background=SKY[L]+" fixed";S.start();
$("#app").innerHTML=`<div class="hud" id="hud"></div><div class="board" style="--cm:${[2,3,2][L]};--cd:4" id="bd">${cards.map(([i,t],k)=>`<button class="cd" data-k="${k}" aria-label="Kartu tertutup"><span class="in"><span class="f bk">🌅</span><span class="f fr ${t?"df":"tm"}">${face(mode,ch[i],t)}</span></span></button>`).join("")}</div>
<div class="row"><button class="btn" id="hn"></button><button class="btn" id="mn">Menu</button></div>`;
hud();G.iv=setInterval(()=>{G.sec++;hud()},1000);
$("#bd").onclick=e=>{const b=e.target.closest(".cd");if(b)flip(+b.dataset.k)};
$("#mn").onclick=menu;
$("#hn").onclick=()=>{if(G.lock||!G.hint)return;G.hint--;G.score=Math.max(0,G.score-50);G.lock=true;S.peek();hud();
const pk=[...document.querySelectorAll(".cd:not(.ok):not(.on)")];pk.forEach(c=>c.classList.add("peek"));
setTimeout(()=>{pk.forEach(c=>c.classList.remove("peek"));G.lock=false},1300)}}
function flip(k){
const el=document.querySelector(`.cd[data-k="${k}"]`);if(G.lock||el.classList.contains("on")||el.classList.contains("ok"))return;
el.classList.add("on");S.flip();G.open.push(k);
const c=G.cards[k],p=G.ch[c[0]];el.setAttribute("aria-label",c[1]?p[1]:p[0]);
if(G.open.length<2)return;
G.moves++;const[a,b]=G.open,A1=document.querySelector(`.cd[data-k="${a}"]`),B1=document.querySelector(`.cd[data-k="${b}"]`);
if(G.cards[a][0]==G.cards[b][0]){
 A1.classList.add("ok");B1.classList.add("ok");G.found++;G.combo++;G.score+=100*Math.min(G.combo,5);G.open=[];
 fact(`✔ ${nm(p)}: ${p[1]}`);S.good(G.combo);hud();
 if(G.found==G.n)setTimeout(winMem,900)}
else{G.lock=true;G.combo=0;S.bad();hud();setTimeout(()=>{A1.classList.remove("on");B1.classList.remove("on");G.open=[];G.lock=false},950)}}
function winMem(){
clearInterval(G.iv);G.score+=Math.max(0,300-G.sec*3);
const m=G.moves,s=m<=Math.ceil(G.n*1.6)?3:m<=G.n*2.5?2:1,key=G.mode+"_"+G.L,mode=G.mode,L=G.L;
ST[key]=Math.max(ST[key]||0,s);save();
done(`Level ${L+1} selesai!`,G.score,`${m} langkah dalam ${fmt(G.sec)}`,s,G.ch,
 L<2?[`Level ${L+2}`,()=>play(mode,L+1)]:null,()=>play(mode,L))}
/* kuis */
function quiz(m){
reset();const T={kilat:12,pilih:15,bs:9}[m];
const rounds=shuf(P).slice(0,10).map(t=>{const o=shuf(P.filter(x=>x!==t)).slice(0,3);
 if(m=="kilat")return{t,pr:`<div class="big">${svg(t[3],112)}</div><p class="qd">Gambar ini mewakili istilah…</p>`,op:shuf([t,...o]).map(x=>({h:`<b>${x[0]}</b>`,ok:x==t}))};
 if(m=="pilih")return{t,pr:`<p class="qd">${t[1]}</p><p>Gambar mana yang cocok?</p>`,op:shuf([t,...o]).map(x=>({h:svg(x[3],84),ok:x==t}))};
 const tr=Math.random()<.5,d=tr?t:o[0];
 return{t,pr:`<div class="big">${svg(t[3],92)}</div><h2 style="text-align:center">${t[0]}</h2><p class="qd">“${d[1]}”</p>`,op:[{h:"✔ Benar",ok:tr},{h:"✘ Salah",ok:!tr}]}});
G={m,rounds,T,t:T,r:0,score:0,streak:0,right:0,lock:false};
document.body.style.background=SKY[m=="kilat"?0:m=="pilih"?1:2]+" fixed";S.start();show()}
function qhud(){$("#hud").innerHTML=`<div><b>${G.r+1}/10</b><small>ronde</small></div><div><b>${G.score}</b><small>skor</small></div><div><b>${G.streak>1?"🔥"+G.streak:"-"}</b><small>beruntun</small></div>`;$("#tb").style.width=Math.max(0,G.t/G.T*100)+"%"}
function show(){
const q=G.rounds[G.r];G.lock=false;G.t=G.T;G.lastTick=Math.ceil(G.T);
$("#app").innerHTML=`<div class="hud" id="hud"></div><div class="bar"><i id="tb"></i></div>
<div class="card" style="margin-top:12px">${q.pr}<div class="opts">${q.op.map((o,i)=>`<button class="btn opt" data-o="${i}" aria-label="Pilihan ${i+1}">${o.h}</button>`).join("")}</div></div>
<button class="btn" id="mn">Menu</button>`;
qhud();$("#mn").onclick=menu;
document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>ans(+b.dataset.o));
clearInterval(G.iv);G.iv=setInterval(()=>{G.t-=.1;const c=Math.ceil(G.t);if(c<=3&&c>0&&c<G.lastTick){G.lastTick=c;S.tick()}qhud();if(G.t<=0)ans(-1)},100)}
function ans(k){
if(G.lock)return;G.lock=true;clearInterval(G.iv);
const q=G.rounds[G.r],bt=[...document.querySelectorAll(".opt")];
bt.forEach((b,i)=>{if(q.op[i].ok)b.classList.add("yes");else if(i==k)b.classList.add("no")});
if(k>=0&&q.op[k].ok){G.streak++;G.right++;G.score+=100+Math.ceil(G.t*10)+20*Math.min(G.streak,5)-20;S.good(G.streak);fact(`✔ ${nm(q.t)}: ${q.t[1]}`)}
else{G.streak=0;k<0?S.over():S.bad();fact(`${k<0?"Waktu habis. ":"Belum tepat. "}${nm(q.t)}: ${q.t[1]}`)}
qhud();
setTimeout(()=>{if(++G.r>=10)winQ();else show()},1800)}
function winQ(){
const r=G.right,s=r>=9?3:r>=7?2:r>=5?1:0,m=G.m;ST[m]=Math.max(ST[m]||0,s);save();
done(r>=5?"Ronde selesai!":"Coba lagi, pasti bisa!",G.score,`${r} dari 10 jawaban benar`,s,G.rounds.map(x=>x.t),null,()=>quiz(m))}
/* layar hasil */
function done(title,score,sub,s,learn,next,again){
clearInterval(G.iv);$("#ft").classList.remove("show");
if(s){boom();S.fan()}else S.over();window.scrollTo(0,0);
$("#app").innerHTML=`<div class="card" style="margin-top:44px;text-align:center"><h2>${title}</h2><div class="stars">${"⭐".repeat(s)||"💪"}</div>
<p><b style="font-size:34px">${score}</b> poin<br>${sub}</p>
<div class="row">${next?`<button class="btn go" id="nx">${next[0]}</button>`:""}<button class="btn" id="ag">Main lagi</button><button class="btn" id="m2">Menu</button></div>
<div style="text-align:left"><h3>Yang kamu pelajari</h3><dl>${learn.map(p=>`<dt>${svg(p[3],30)}${nm(p)}</dt><dd>${p[1]}</dd>`).join("")}</dl></div></div>`;
if(next)$("#nx").onclick=next[1];$("#ag").onclick=again;$("#m2").onclick=menu}
menu();
</script>
</body>
</html>
